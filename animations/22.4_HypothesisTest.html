<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hypothesis test for two means: by hand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">

window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:true}};

<style>
:root{
  --ground:#ffffff; --surface:#f2f5fa; --surface-2:#e3e9f3; --line:#c3cfe4;
  --ink:#16181a; --ink-2:#55595e; --main:#1e376c; --main-soft:#7e96c4;
  --accent:#f47920; --accent-soft:#fde9cf; --accent-deep:#b85410; --ok:#2e7d4f;
  --sans:"Nunito Sans","Museo Sans",Helvetica,Arial,sans-serif;
  --slab:"Zilla Slab","Museo Slab",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1830; --surface:#132349; --surface-2:#1e376c; --line:#2a4a8c;
    --ink:#f2f5fa; --ink-2:#c3cfe4; --main:#c3cfe4; --main-soft:#7e96c4;
    --accent:#faa634; --accent-soft:#4a3517; --accent-deep:#f47920; --ok:#6fcf97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1830; --surface:#132349; --surface-2:#1e376c; --line:#2a4a8c;
  --ink:#f2f5fa; --ink-2:#c3cfe4; --main:#c3cfe4; --main-soft:#7e96c4;
  --accent:#faa634; --accent-soft:#4a3517; --accent-deep:#f47920; --ok:#6fcf97;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,40px) 10px;border-bottom:3px solid var(--accent)}
header h1{font-family:var(--slab);font-weight:700;font-size:clamp(20px,2.6vw,28px);margin:0;color:var(--main);line-height:1.15}
header .course{font-size:14px;color:var(--ink-2);white-space:nowrap}
main{flex:1;position:relative;width:100%;max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(16px,4vw,40px)}
.slide{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:start}
.slide.on{display:grid;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.copy{max-width:60ch}
.tag{display:inline-block;font-size:14px;font-weight:800;color:var(--accent-deep);margin-bottom:4px}
.copy h2{font-family:var(--slab);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0 0 16px;color:var(--main)}
.copy p{margin:0 0 12px}
.copy .ask{border-left:3px solid var(--accent);padding-left:12px;font-weight:600}
.copy .note{color:var(--ink-2);font-size:15px}
.copy .math{overflow-x:auto;margin:6px 0 12px;padding:2px 0}
.copy b{font-weight:800}
kbd{font-family:var(--sans);font-weight:800;font-size:13px;background:var(--main);color:var(--ground);padding:1px 7px;border-radius:5px;white-space:nowrap}
.visual{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center}
.panel{width:100%;background-color:var(--surface);border-radius:18px;padding:clamp(14px,2.5vw,26px);background-image:linear-gradient(var(--surface-2) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--surface-2) 1.5px,transparent 1.5px);background-size:40px 40px}

/* samples */
.grp{margin:4px 0 18px}
.grp .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.grp .name{font-weight:800;color:var(--main)}
.grp .cnt{color:var(--ink-2);font-size:15px}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.y{background:var(--accent)}
.legend{font-size:14px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--line)}
.legend span.y::before{background:var(--accent)}
/* tiles */
.tiles{display:grid;gap:10px;width:100%}
.tile{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:12px 14px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.tile.in{opacity:1;transform:none}
.tile .k{font-size:14px;color:var(--ink-2)}
.tile .v{font-family:var(--slab);font-size:clamp(24px,3vw,32px);font-weight:700;color:var(--main);line-height:1.1;display:flex;align-items:center;gap:10px}
.tile .ck{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--ground);display:inline-grid;place-items:center;font-size:15px;transform:scale(0);transition:transform .3s .25s}
.tile.in .ck{transform:scale(1)}
.tilecap{font-size:14px;color:var(--ink-2);margin-top:10px;text-align:center}

/* svg charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:13px}
svg.chart .lbl{fill:var(--ink);font-weight:800;font-size:15px}
svg.chart .lblm{fill:var(--main);font-weight:800;font-size:15px}
svg.chart .lbla{fill:var(--accent-deep);font-weight:800;font-size:15px}
.fade{opacity:0;transition:opacity .45s}
.fade.in{opacity:1}
.grow{transform:scaleX(0);transform-box:fill-box;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.grow.l{transform-origin:right center}.grow.r{transform-origin:left center}
.grow.in{transform:scaleX(1)}
.drop{transform:translateY(-30px);opacity:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.drop.in{transform:none;opacity:1}
.slidex{transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}

/* calculator */
.calc{width:min(330px,100%);background:#25282b;border-radius:26px 26px 40px 40px;padding:18px 16px 22px;box-shadow:0 2px 0 #3a3e42 inset}
.screen{background:#dfe6d8;border:6px solid #16181a;border-radius:8px;padding:8px 9px;font-family:var(--mono);font-size:clamp(10.5px,3.4vw,13.5px);line-height:1.38;color:#16181a;height:calc(10 * 1.38em + 16px);overflow:hidden;white-space:pre}
.screen .ln{min-height:1.38em}
.screen .inv{background:#16181a;color:#dfe6d8}
.screen .cur{box-shadow:0 2px 0 #f47920}
.screen span.cur:not(.inv){color:#b85410}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;align-items:center}
.key{font-family:var(--sans);font-weight:800;font-size:12px;border:0;border-radius:8px;height:30px;background:#3a3e42;color:#f1f2f3;transition:transform .08s,background .15s;cursor:default}
.key.num{background:#e4e5e7;color:#16181a;font-size:14px}
.key.blue{background:#3a5fa8}
.key.enter{background:#3a3e42}
.key.down{transform:scale(.9);background:#f47920 !important;color:#16181a}
.toprow{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr) 1.15fr;gap:8px;align-items:center}
.lkeys{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/3}
.dpad{grid-column:3;grid-row:1/3;position:relative;width:92px;height:76px;justify-self:center}
.dpad .key{position:absolute;width:32px;height:24px;font-size:11px;padding:0}
.dpad .k-UP{left:30px;top:0}.dpad .k-DOWN{left:30px;bottom:0}.dpad .k-LEFT{left:0;top:26px}.dpad .k-RIGHT{right:0;top:26px}
.log{width:min(330px,100%);min-height:34px;margin-top:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.log .chip{font-weight:800;font-size:12px;background:var(--main);color:var(--ground);border-radius:5px;padding:2px 7px;animation:pop .2s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.replay{margin-top:6px;font:inherit;font-size:14px;font-weight:700;background:none;border:1.5px solid var(--main);color:var(--main);border-radius:999px;padding:4px 14px;cursor:pointer}
.replay:hover{background:var(--surface)}

/* nav */
nav.bar{position:sticky;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding:12px clamp(16px,4vw,40px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.btn{font:inherit;font-weight:800;font-size:16px;border-radius:10px;padding:10px 22px;cursor:pointer;border:2px solid var(--main);background:transparent;color:var(--main)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#16181a}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.replay:focus-visible,.seg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{flex:1;display:flex;gap:4px;align-items:center}
.seg{flex:1;height:8px;border-radius:4px;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.seg.done{background:var(--main-soft)}.seg.cur{background:var(--accent)}
.count{font-size:14px;color:var(--ink-2);min-width:52px;text-align:center}
@media (max-width:820px){
  .slide{grid-template-columns:1fr}
  .copy{max-width:none}
  .btn{padding:9px 14px}
  header .course{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><span class="course" id="course"></span></header>
<main id="deck" aria-live="polite"></main>
<nav class="bar">
  <button class="btn" id="back">Back</button>
  <div class="prog" id="prog"></div>
  <span class="count" id="count"></span>
  <button class="btn primary" id="next">Next</button>
</nav>
<script>
const FILM = {"title": "Hypothesis test for two means: by hand", "course": "MATH 1040, Lesson 22.4", "slides": [{"tag": "The problem", "title": "Is study time different?", "body": "<p>An instructor surveys a random sample of <b>10<\/b> in-person students and an independent random sample of <b>12<\/b> online students about how many hours they studied last week.<\/p><p class='ask'>At the 5% significance level, is the mean weekly study time different for in-person and online students?<\/p><p class='note'>Group 1 is in-person students. Group 2 is online students.<\/p><p class='note'>In-person: 7.5, 9.0, 6.0, 8.5, 10.0, 7.0, 8.0, 11.5, 9.5, 8.0<br>Online: 6.0, 5.5, 7.0, 4.5, 8.0, 6.5, 5.0, 7.5, 6.0, 9.0, 5.5, 6.5<\/p>", "visual": {"type": "dotplot", "min": 4, "max": 12, "step": 1, "axis": "Study hours last week", "aria": "Dot plots of weekly study hours. In-person: 10 students from 6 to 11.5 hours, mean 8.5. Online: 12 students from 4.5 to 9 hours, mean about 6.42.", "groups": [{"name": "In-person", "n": "n₁ = 10", "mean": "x̄₁ = 8.5", "vals": [7.5, 9.0, 6.0, 8.5, 10.0, 7.0, 8.0, 11.5, 9.5, 8.0]}, {"name": "Online", "n": "n₂ = 12", "mean": "x̄₂ ≈ 6.42", "vals": [6.0, 5.5, 7.0, 4.5, 8.0, 6.5, 5.0, 7.5, 6.0, 9.0, 5.5, 6.5]}]}}, {"tag": "Step 1", "title": "Verify the conditions", "body": "<p><b>Random?<\/b> Yes, both samples are random.<\/p><p><b>Independent?<\/b> Yes, different students in two separate groups.<\/p><p><b>Large enough?<\/b> Both samples are under 30, so the populations must be nearly normal. The dot plots show no strong skew and no extreme outliers.<\/p>", "visual": {"type": "tiles", "cols": 2, "check": true, "ckl": "condition met", "cap": "All three conditions are met ✓", "items": [["Random samples", "Yes"], ["Independent groups", "Yes"], ["n₁ = 10, n₂ = 12", "Under 30"], ["Dot plots", "Nearly normal"]]}}, {"tag": "Step 2", "title": "State the hypotheses", "body": "<div class='math'>\\[H_0: \\mu_1 = \\mu_2 \\qquad H_A: \\mu_1 \\ne \\mu_2\\]<\/div><p>“Different” doesn’t point either way, so this is a <b>two-tailed<\/b> test. Large \\(t\\) values in either direction count as evidence.<\/p>", "visual": {"type": "tcurve", "df": 17.41, "tc": 2.106, "t": 3.338, "p": "0.0038", "mode": "test", "stage": 1, "aria": "t-curve with both tails shaded as rejection regions for a two-tailed test"}}, {"tag": "Step 3", "title": "Compute the test statistic", "body": "<div class='math'>\\[\\bar x_1 = 8.5,\\ s_1 = 1.5811 \\qquad \\bar x_2 \\approx 6.4167,\\ s_2 = 1.2939\\]<\/div><div class='math'>\\[SE=\\sqrt{\\tfrac{1.5811^2}{10}+\\tfrac{1.2939^2}{12}}\\approx 0.6241\\]<\/div><div class='math'>\\[t=\\frac{(8.5-6.4167)-0}{0.6241}=\\frac{2.0833}{0.6241}\\approx 3.338\\]<\/div>", "visual": {"type": "tcurve", "df": 17.41, "tc": 2.106, "t": 3.338, "p": "0.0038", "mode": "test", "stage": 2, "aria": "t-curve with the test statistic t equals 3.338 marked far to the right"}}, {"tag": "Step 4", "title": "Critical value and p-value", "body": "<p>Two-tailed at \\(\\alpha = 0.05\\) with df ≈ 17.41: <b>invT(0.975, 17.41)<\/b> gives \\(t_c = \\pm 2.106\\).<\/p><div class='math'>\\[p = 2\\,P(T > 3.338) \\approx 2(0.0019) \\approx 0.0038\\]<\/div><p>On the TI-84, <b>tcdf(3.338, 1E99, 17.41)<\/b> gives one tail; double it.<\/p><p>The light regions are where we would reject \\(H_0\\). The dark slivers beyond our \\(t\\) make up the p-value.<\/p>", "visual": {"type": "tcurve", "df": 17.41, "tc": 2.106, "t": 3.338, "p": "0.0038", "mode": "test", "stage": 3, "aria": "t-curve with rejection regions beyond negative and positive 2.106, the test statistic 3.338 inside the right one, and tiny p-value tails beyond 3.338"}}, {"tag": "Step 5", "title": "Decision and conclusion", "body": "<p>\\(|t| = 3.338 > t_c = 2.106\\): <b>reject \\(H_0\\)<\/b>.<\/p><p>\\(p \\approx 0.0038 \\le \\alpha = 0.05\\): <b>reject \\(H_0\\)<\/b>.<\/p><p class='ask'>There is enough evidence at the 5% significance level to conclude that the mean weekly study time is different for in-person and online students.<\/p>", "visual": {"type": "tcurve", "df": 17.41, "tc": 2.106, "t": 3.338, "p": "0.0038", "mode": "test", "stage": 4, "aria": "t-curve: t equals 3.338 lies beyond the critical value 2.106, in the rejection region, with p about 0.0038"}}]};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const deck = document.getElementById('deck');
document.getElementById('ttl').textContent = FILM.title;
document.getElementById('course').textContent = FILM.course;
const NS='http://www.w3.org/2000/svg';
let timers=[];
function later(fn,ms){const t=setTimeout(fn,RM?0:ms);timers.push(t);return t}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ---------- visuals ---------- */
function samples(v){
  const p=el('div','panel');
  v.groups.forEach(g=>{
    const d=el('div','grp');
    const ph=(g.x/g.n);
    d.innerHTML=`<div class="row"><span class="name">${g.name}</span><span class="cnt">${g.x} of ${g.n}</span></div>`;
    const dots=el('div','dots');
    const total=100, yes=Math.round(ph*100);
    for(let i=0;i<total;i++) dots.appendChild(el('i'));
    d.appendChild(dots);p.appendChild(d);
    d._fill=()=>{[...dots.children].forEach((c,i)=>{if(i<yes)later(()=>c.classList.add('y'),i*18)})};
  });
  p.appendChild(el('div','legend',`<span class="y">${v.unit}</span><span>did not</span><span style="margin-left:auto">each dot is 1% of the sample</span>`));
  return {node:p,play(){p.querySelectorAll('.grp').forEach((g,i)=>later(g._fill,300+i*500))}};
}
function tiles(v){
  const w=el('div','panel');
  const t=el('div','tiles');t.style.gridTemplateColumns=`repeat(${v.cols},1fr)`;
  v.items.forEach(([k,val])=>{
    const d=el('div','tile',`<div class="k">${k}</div><div class="v">${val}${v.check?'<span class="ck" aria-label="'+(v.ckl||'at least 10')+'">✓</span>':''}</div>`);
    t.appendChild(d);
  });
  w.appendChild(t);
  if(v.check) w.appendChild(el('div','tilecap',v.cap||'Each one is at least 10 ✓'));
  return {node:w,play(){[...t.children].forEach((c,i)=>later(()=>c.classList.add('in'),250+i*260))}};
}
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,cls,anchor){const t=svgEl('text',{x,y,'text-anchor':anchor||'middle'},parent);if(cls)t.setAttribute('class',cls);t.textContent=s;return t}
function fmt(x){return (x<0?'−':'')+Math.abs(x).toFixed(3).replace(/^0/,'0')}

function numberline(v){
  const fmt=x=>(x<0?'−':'')+Math.abs(x).toFixed(v.dec==null?3:v.dec);
  const W=560,H=230,L=30,R=530,ax=150;
  const X=x=>L+(x-v.min)/(v.max-v.min)*(R-L);
  const p=el('div','panel');
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':v.aria||'Number line for p1 minus p2'});
  // zero emphasis band
  const zero=svgEl('g',{class:v.stage>=3?'fade':''},s);
  svgEl('line',{x1:X(0),x2:X(0),y1:30,y2:ax+8,stroke:'var(--accent)','stroke-width':v.stage>=3?3:2,'stroke-dasharray':'6 5'},zero);
  txt(zero,X(0),22,v.stage>=3?'0 = no difference':'0','lbla');
  if(v.stage<3) zero.classList.remove('fade');
  svgEl('line',{x1:L-10,x2:R+10,y1:ax,y2:ax,stroke:'var(--ink-2)','stroke-width':2},s);
  for(let t=v.min;t<=v.max+1e-9;t+=(v.step||0.05)){
    const x=X(t);svgEl('line',{x1:x,x2:x,y1:ax-6,y2:ax+6,stroke:'var(--ink-2)','stroke-width':1.5},s);
    txt(s,x,ax+26,(Math.abs(t)<1e-9?'0':t.toFixed(v.tdec==null?2:v.tdec).replace('-','−')));
  }
  txt(s,(L+R)/2,ax+52,v.axis||'p₁ − p₂');
  const cy=ax-48;
  const items=[];
  if(v.lo!=null){
    const gl=svgEl('rect',{x:X(v.lo),y:cy-4,width:X(v.est)-X(v.lo),height:8,rx:4,fill:'var(--main)',class:'grow l'},s);
    const gr=svgEl('rect',{x:X(v.est),y:cy-4,width:X(v.hi)-X(v.est),height:8,rx:4,fill:'var(--main)',class:'grow r'},s);
    const ends=svgEl('g',{class:'fade'},s);
    [v.lo,v.hi].forEach(b=>{svgEl('line',{x1:X(b),x2:X(b),y1:cy-16,y2:cy+16,stroke:'var(--main)','stroke-width':3},ends);txt(ends,X(b),cy+38,fmt(b),'lblm')});
    const E=svgEl('g',{class:'fade'},s);
    txt(E,(X(v.est)+X(v.hi))/2,cy-22,'± E','lbla');
    items.push([gl,900],[gr,900],[E,1300],[ends,1700]);
  }
  const dot=svgEl('g',{class:'drop'},s);
  svgEl('circle',{cx:X(v.est),cy,r:9,fill:'var(--accent)',stroke:'var(--ground)','stroke-width':3},dot);
  txt(dot,X(v.est),cy-26,(v.lo!=null?'':(v.estp==null?'p̂₁ − p̂₂ = ':v.estp))+fmt(v.est),'lbl');
  items.unshift([dot,300]);
  if(v.stage>=3){
    const note=svgEl('g',{class:'fade'},s);
    svgEl('rect',{x:X(v.lo),y:cy+50,width:X(0)-X(v.lo),height:0},note);
    txt(note,v.noteAt!=null?X(v.noteAt):(X(v.lo)+X(0))/2,H-6,v.note||'entire interval is below 0','lbla');
    items.push([zero,2000],[note,2400]);
  }
  p.appendChild(s);
  return {node:p,play(){items.forEach(([e,ms])=>later(()=>e.classList.add('in'),ms))}};
}

function curve(v){
  const W=560,H=300,L=20,R=540,base=230,top=40,lo=-3.6,hi=3.6;
  const X=z=>L+(z-lo)/(hi-lo)*(R-L);
  const pdf=z=>Math.exp(-z*z/2);
  const Y=z=>base-(base-top)*pdf(z);
  const path=(a,b)=>{let d=`M${X(a)},${base}`;for(let z=a;z<=b+1e-9;z+=0.02)d+=`L${X(z).toFixed(1)},${Y(z).toFixed(1)}`;return d+`L${X(b)},${base}Z`};
  const p=el('div','panel');
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Standard normal curve'});
  const items=[];
  const crit=svgEl('path',{d:path(v.zc,hi),fill:'var(--accent-soft)',class:v.stage>=1?'fade':''},s);
  const pv=svgEl('path',{d:path(v.z,hi),fill:'var(--accent)',class:'fade'},s);
  let line='';for(let z=lo;z<=hi;z+=0.02)line+=(line?'L':'M')+X(z).toFixed(1)+','+Y(z).toFixed(1);
  svgEl('path',{d:line,fill:'none',stroke:'var(--main)','stroke-width':3},s);
  svgEl('line',{x1:L,x2:R,y1:base,y2:base,stroke:'var(--ink-2)','stroke-width':2},s);
  [-3,-2,-1,0,1,2,3].forEach(t=>{svgEl('line',{x1:X(t),x2:X(t),y1:base,y2:base+6,stroke:'var(--ink-2)'},s);txt(s,X(t),base+22,String(t).replace('-','−'))});
  txt(s,X(0),base+48,'z');
  // labels
  const cg=svgEl('g',{class:'fade'},s);
  svgEl('line',{x1:X(v.zc),x2:X(v.zc),y1:top+6,y2:base,stroke:'var(--accent-deep)','stroke-width':2,'stroke-dasharray':'5 4'},cg);
  {const tt=txt(cg,X(v.zc),top-4,'z','lbla');const sb=svgEl('tspan',{'baseline-shift':'sub','font-size':'11'},tt);sb.textContent='c';const r=svgEl('tspan',{},tt);r.textContent=' = '+v.zc;tt.firstChild.textContent='z';}
  const rej=svgEl('g',{class:'fade'},s);
  txt(rej,X(2.45),base-58,v.stage>=4?'reject H₀':'reject H₀ here','lbla','start');
  const zg=svgEl('g',{class:'drop'},s);
  svgEl('line',{x1:X(v.z),x2:X(v.z),y1:top+40,y2:base,stroke:'var(--main)','stroke-width':3},zg);
  svgEl('circle',{cx:X(v.z),cy:top+40,r:7,fill:'var(--main)'},zg);
  txt(zg,X(v.z)+6,top+24,'z = 2.33','lblm','start');
  const pl=svgEl('g',{class:'fade'},s);
  txt(pl,X(2.45),base-30,'p ≈ 0.0098','lbl','start');
  const ht=svgEl('g',{class:'fade'},s);
  txt(ht,X(-1.9),top+30,'right-tailed test','lblm');
  if(v.stage===1){items.push([crit,300],[rej,700],[ht,1000])}
  if(v.stage===2){crit.style.opacity=.0;items.push([zg,300])}
  if(v.stage>=3){items.push([crit,250],[cg,600],[rej,900],[zg,1300],[pv,1900],[pl,2200])}
  p.appendChild(s);
  return {node:p,play(){items.forEach(([e,ms])=>later(()=>e.classList.add('in'),ms))}};
}

const KEYLBL={UP:'▲',DOWN:'▼',LEFT:'◄',RIGHT:'►',NEG:'(−)',MUL:'×',SUB:'−',ADD:'+',DIV:'÷',XT:'X,T,θ,n','2ND':'2ND'};
function calc(v){
  const wrap=el('div','visual-calc panel');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%';
  const c=el('div','calc');
  const scr=el('div','screen');scr.setAttribute('role','img');scr.setAttribute('aria-label','Calculator screen');
  c.appendChild(scr);
  const keys=el('div','keys');
  const mk=(id,label,cls)=>{const b=el('button','key '+(cls||'')+' k-'+id,label);b.tabIndex=-1;b.setAttribute('aria-hidden','true');b.dataset.k=id;return b};
  const top=el('div','toprow');const lk=el('div','lkeys');
  [['2ND','2ND','blue'],['MODE','MODE'],['ALPHA','ALPHA'],['STAT','STAT']].forEach(a=>lk.appendChild(mk(...a)));
  const dp=el('div','dpad');['UP','DOWN','LEFT','RIGHT'].forEach(k=>dp.appendChild(mk(k,KEYLBL[k])));
  top.appendChild(lk);top.appendChild(dp);keys.appendChild(top);
  [['7','8','9','DIV'],['4','5','6','MUL'],['1','2','3','SUB'],['0','.','NEG','ENTER']].forEach(r=>r.forEach(k=>{
    const isNum=/^[0-9.]$|NEG/.test(k);keys.appendChild(mk(k,KEYLBL[k]||k,isNum?'num':(k==='ENTER'?'enter':'')))
  }));
  c.appendChild(keys);
  const log=el('div','log');
  const rp=el('button','replay','Replay keystrokes');
  wrap.appendChild(c);wrap.appendChild(log);wrap.appendChild(rp);
  function draw(lines){
    scr.innerHTML='';
    lines.forEach(l=>{const d=el('div','ln');l.forEach(([t,st])=>{const sp=el('span',st||'');sp.textContent=t;d.appendChild(sp)});scr.appendChild(d)});
  }
  function run(){
    clearTimers();log.innerHTML='';draw(v.seg.start);
    let t=500;
    v.seg.steps.forEach(st=>{t+=st.w||0;
      later(()=>{
        const k=keys.querySelector('.k-'+CSS.escape(st.k));
        if(k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),RM?0:240)}
        log.appendChild(el('span','chip',KEYLBL[st.k]||st.k));
        draw(st.s);
      },t);
      t+= (/^[0-9.]$|NEG/.test(st.k))?420:700;
    });
  }
  rp.onclick=run;
  draw(v.seg.start);
  return {node:wrap,play:run};
}

function dotplot(v){
  const W=560,H=290,L=30,R=530;
  const X=x=>L+(x-v.min)/(v.max-v.min)*(R-L);
  const p=el('div','panel');
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':v.aria});
  const items=[];
  v.groups.forEach((g,gi)=>{
    const base=78+gi*140, ax=base+14;
    txt(s,L,base-48,g.name,'lblm','start');
    txt(s,R,base-48,g.n,'lbl','end');
    svgEl('line',{x1:L-6,x2:R+6,y1:ax,y2:ax,stroke:'var(--ink-2)','stroke-width':2},s);
    for(let t=v.min;t<=v.max+1e-9;t+=v.step){svgEl('line',{x1:X(t),x2:X(t),y1:ax-5,y2:ax+5,stroke:'var(--ink-2)','stroke-width':1.5},s);txt(s,X(t),ax+22,String(t))}
    const seen={};
    g.vals.slice().sort((a,b)=>a-b).forEach((val,i)=>{
      const k=seen[val]||0;seen[val]=k+1;
      const d=svgEl('circle',{cx:X(val),cy:base-k*18,r:8,fill:gi?'var(--accent)':'var(--main)',class:'drop'},s);
      items.push([d,250+gi*700+i*55]);
    });
    const m=g.vals.reduce((a,b)=>a+b,0)/g.vals.length;
    const mg=svgEl('g',{class:'fade'},s);
    svgEl('line',{x1:X(m),x2:X(m),y1:ax,y2:base-34,stroke:'var(--accent-deep)','stroke-width':2,'stroke-dasharray':'5 4'},mg);
    txt(mg,X(m),base-40,g.mean,'lbla');
    items.push([mg,250+gi*700+g.vals.length*55+250]);
  });
  txt(s,(L+R)/2,H-4,v.axis);
  p.appendChild(s);
  return {node:p,play(){items.forEach(([e,ms])=>later(()=>e.classList.add('in'),ms))}};
}

function tcurve(v){
  const W=560,H=300,L=20,R=540,base=230,top=46,lo=-4,hi=4;
  const X=z=>L+(z-lo)/(hi-lo)*(R-L);
  const pdf=z=>Math.pow(1+z*z/v.df,-(v.df+1)/2);
  const Y=z=>base-(base-top)*pdf(z);
  const area=(a,b)=>{let d=`M${X(a)},${base}`;for(let z=a;z<=b+1e-9;z+=0.02)d+=`L${X(z).toFixed(1)},${Y(z).toFixed(1)}`;return d+`L${X(b)},${base}Z`};
  const f=x=>(x<0?'−':'')+Math.abs(x).toFixed(3);
  const p=el('div','panel');
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':v.aria});
  const items=[];
  const g=(cls)=>svgEl('g',{class:cls||'fade'},s);
  // shaded regions sit under the curve line
  const mid=g(); if(v.mode==='ci') svgEl('path',{d:area(-v.tc,v.tc),fill:'var(--accent-soft)'},mid);
  const crit=g(); if(v.mode!=='ci'){svgEl('path',{d:area(v.tc,hi),fill:'var(--accent-soft)'},crit);svgEl('path',{d:area(lo,-v.tc),fill:'var(--accent-soft)'},crit)}
  const pv=g(); if(v.mode!=='ci'){svgEl('path',{d:area(v.t,hi),fill:'var(--accent)'},pv);svgEl('path',{d:area(lo,-v.t),fill:'var(--accent)'},pv)}
  let line='';for(let z=lo;z<=hi;z+=0.02)line+=(line?'L':'M')+X(z).toFixed(1)+','+Y(z).toFixed(1);
  svgEl('path',{d:line,fill:'none',stroke:'var(--main)','stroke-width':3},s);
  svgEl('line',{x1:L,x2:R,y1:base,y2:base,stroke:'var(--ink-2)','stroke-width':2},s);
  [-3,-2,-1,0,1,2,3].forEach(t=>{svgEl('line',{x1:X(t),x2:X(t),y1:base,y2:base+6,stroke:'var(--ink-2)'},s);txt(s,X(t),base+22,String(t).replace('-','−'))});
  txt(s,X(0),base+48,'t (df ≈ '+v.df.toFixed(2)+')');
  const cg=g();
  [-v.tc,v.tc].forEach(c=>{svgEl('line',{x1:X(c),x2:X(c),y1:top+8,y2:base,stroke:'var(--accent-deep)','stroke-width':2,'stroke-dasharray':'5 4'},cg);txt(cg,X(c),top-2,f(c),'lbla')});
  const lab=g();
  if(v.mode==='ci'){
    txt(lab,X(0),base-60,'middle 95%','lblm');
    txt(lab,X(-3.1),base-30,'2.5%','lbla');txt(lab,X(3.1),base-30,'2.5%','lbla');
    items.push([mid,300],[cg,800],[lab,1200]);
  } else {
    const word=v.stage>=4?'reject H₀':'reject H₀ here';
    txt(lab,X(2.25),top+52,word,'lbla','start');txt(lab,X(-2.25),top+52,word,'lbla','end');
    const ht=g();txt(ht,X(0),top-22,'two-tailed test','lblm');
    const tg=svgEl('g',{class:'drop'},s);
    svgEl('line',{x1:X(v.t),x2:X(v.t),y1:top+96,y2:base,stroke:'var(--main)','stroke-width':3},tg);
    svgEl('circle',{cx:X(v.t),cy:top+96,r:7,fill:'var(--main)'},tg);
    txt(tg,X(v.t)-12,top+101,'t = '+v.t.toFixed(2),'lblm','end');
    const pl=g();txt(pl,X(0),base-14,'p ≈ '+v.p+' (both tails)','lbl');
    if(v.stage===1)items.push([crit,300],[lab,700],[ht,1000]);
    if(v.stage===2)items.push([tg,300]);
    if(v.stage>=3)items.push([crit,250],[cg,600],[lab,900],[tg,1300],[pv,1900],[pl,2200]);
  }
  p.appendChild(s);
  return {node:p,play(){items.forEach(([e,ms])=>later(()=>e.classList.add('in'),ms))}};
}

const BUILD={samples,tiles,numberline,curve,calc,dotplot,tcurve};

/* ---------- deck ---------- */
const slides=FILM.slides.map((s,i)=>{
  const sec=el('section','slide');sec.setAttribute('aria-label',`Slide ${i+1}: ${s.title}`);
  const copy=el('div','copy',`<span class="tag">${s.tag}</span><h2>${s.title}</h2>${s.body}`);
  const vis=el('div','visual');
  const v=BUILD[s.visual.type](s.visual);
  vis.appendChild(v.node);
  sec.appendChild(copy);sec.appendChild(vis);deck.appendChild(sec);
  return {sec,v};
});
const prog=document.getElementById('prog');
const segs=slides.map((_,i)=>{const b=el('button','seg');b.setAttribute('aria-label','Go to slide '+(i+1));b.onclick=()=>go(i);prog.appendChild(b);return b});
let cur=-1;
function go(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  clearTimers();
  if(cur>=0) slides[cur].sec.classList.remove('on');
  // rebuild visual so its animation plays fresh
  const s=FILM.slides[i];const vis=slides[i].sec.querySelector('.visual');
  const v=BUILD[s.visual.type](s.visual);vis.innerHTML='';vis.appendChild(v.node);slides[i].v=v;
  slides[i].sec.classList.add('on');cur=i;
  segs.forEach((b,j)=>{b.className='seg'+(j<i?' done':'')+(j===i?' cur':'');b.setAttribute('aria-current',j===i?'step':'false')});
  document.getElementById('count').textContent=`${i+1} / ${slides.length}`;
  document.getElementById('back').disabled=i===0;
  const nx=document.getElementById('next');nx.textContent=i===slides.length-1?'Start over':'Next';
  v.play();
  try{history.replaceState(null,'','#slide-'+(i+1))}catch(e){}
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
document.getElementById('back').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur===slides.length-1?0:cur+1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(cur===slides.length-1?cur:cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?+m[1]-1:0}
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());
</script>
