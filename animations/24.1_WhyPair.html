<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --ground:#ffffff; --surface:#f2f5fa; --surface-2:#e3e9f3; --line:#c3cfe4;
  --ink:#16181a; --ink-2:#55595e; --main:#1e376c; --main-soft:#7e96c4;
  --accent:#f47920; --accent-soft:#fde9cf; --accent-deep:#b85410; --ok:#2e7d4f;
  --sans:"Nunito Sans","Museo Sans",Helvetica,Arial,sans-serif;
  --slab:"Zilla Slab","Museo Slab",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1830; --surface:#132349; --surface-2:#1e376c; --line:#2a4a8c;
    --ink:#f2f5fa; --ink-2:#c3cfe4; --main:#c3cfe4; --main-soft:#7e96c4;
    --accent:#faa634; --accent-soft:#4a3517; --accent-deep:#f47920; --ok:#6fcf97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1830; --surface:#132349; --surface-2:#1e376c; --line:#2a4a8c;
  --ink:#f2f5fa; --ink-2:#c3cfe4; --main:#c3cfe4; --main-soft:#7e96c4;
  --accent:#faa634; --accent-soft:#4a3517; --accent-deep:#f47920; --ok:#6fcf97;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,40px) 10px;border-bottom:3px solid var(--accent)}
header h1{font-family:var(--slab);font-weight:700;font-size:clamp(20px,2.6vw,28px);margin:0;color:var(--main);line-height:1.15}
header .course{font-size:14px;color:var(--ink-2);white-space:nowrap}
main{flex:1;position:relative;width:100%;max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(16px,4vw,40px)}
.slide{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:start}
.slide.on{display:grid;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.copy{max-width:60ch}
.tag{display:inline-block;font-size:14px;font-weight:800;color:var(--accent-deep);margin-bottom:4px}
.copy h2{font-family:var(--slab);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0 0 16px;color:var(--main)}
.copy p{margin:0 0 12px}
.copy .ask{border-left:3px solid var(--accent);padding-left:12px;font-weight:600}
.copy .note{color:var(--ink-2);font-size:15px}
.copy .math{overflow-x:auto;margin:6px 0 12px;padding:2px 0}
.copy b{font-weight:800}
kbd{font-family:var(--sans);font-weight:800;font-size:13px;background:var(--main);color:var(--ground);padding:1px 7px;border-radius:5px;white-space:nowrap}
.visual{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center}
.panel{width:100%;background-color:var(--surface);border-radius:18px;padding:clamp(14px,2.5vw,26px);background-image:linear-gradient(var(--surface-2) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--surface-2) 1.5px,transparent 1.5px);background-size:40px 40px}

/* samples */
.grp{margin:4px 0 18px}
.grp .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.grp .name{font-weight:800;color:var(--main)}
.grp .cnt{color:var(--ink-2);font-size:15px}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.y{background:var(--accent)}
.legend{font-size:14px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--line)}
.legend span.y::before{background:var(--accent)}
/* tiles */
.tiles{display:grid;gap:10px;width:100%}
.tile{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:12px 14px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.tile.in{opacity:1;transform:none}
.tile .k{font-size:14px;color:var(--ink-2)}
.tile .v{font-family:var(--slab);font-size:clamp(24px,3vw,32px);font-weight:700;color:var(--main);line-height:1.1;display:flex;align-items:center;gap:10px}
.tile .ck{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--ground);display:inline-grid;place-items:center;font-size:15px;transform:scale(0);transition:transform .3s .25s}
.tile.in .ck{transform:scale(1)}
.tilecap{font-size:14px;color:var(--ink-2);margin-top:10px;text-align:center}

/* svg charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:13px}
svg.chart .lbl{fill:var(--ink);font-weight:800;font-size:15px}
svg.chart .lblm{fill:var(--main);font-weight:800;font-size:15px}
svg.chart .lbla{fill:var(--accent-deep);font-weight:800;font-size:15px}
.fade{opacity:0;transition:opacity .45s}
.fade.in{opacity:1}
.grow{transform:scaleX(0);transform-box:fill-box;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.grow.l{transform-origin:right center}.grow.r{transform-origin:left center}
.grow.in{transform:scaleX(1)}
.drop{transform:translateY(-30px);opacity:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.drop.in{transform:none;opacity:1}
.slidex{transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}

/* calculator */
.calc{width:min(330px,100%);background:#25282b;border-radius:26px 26px 40px 40px;padding:18px 16px 22px;box-shadow:0 2px 0 #3a3e42 inset}
.screen{background:#dfe6d8;border:6px solid #16181a;border-radius:8px;padding:8px 9px;font-family:var(--mono);font-size:clamp(10.5px,3.4vw,13.5px);line-height:1.38;color:#16181a;height:calc(10 * 1.38em + 16px);overflow:hidden;white-space:pre}
.screen .ln{min-height:1.38em}
.screen .inv{background:#16181a;color:#dfe6d8}
.screen .cur{box-shadow:0 2px 0 #f47920}
.screen span.cur:not(.inv){color:#b85410}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;align-items:center}
.key{font-family:var(--sans);font-weight:800;font-size:12px;border:0;border-radius:8px;height:30px;background:#3a3e42;color:#f1f2f3;transition:transform .08s,background .15s;cursor:default}
.key.num{background:#e4e5e7;color:#16181a;font-size:14px}
.key.blue{background:#3a5fa8}
.key.enter{background:#3a3e42}
.key.down{transform:scale(.9);background:#f47920 !important;color:#16181a}
.toprow{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr) 1.15fr;gap:8px;align-items:center}
.lkeys{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/3}
.dpad{grid-column:3;grid-row:1/3;position:relative;width:92px;height:76px;justify-self:center}
.dpad .key{position:absolute;width:32px;height:24px;font-size:11px;padding:0}
.dpad .k-UP{left:30px;top:0}.dpad .k-DOWN{left:30px;bottom:0}.dpad .k-LEFT{left:0;top:26px}.dpad .k-RIGHT{right:0;top:26px}
.log{width:min(330px,100%);min-height:34px;margin-top:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.log .chip{font-weight:800;font-size:12px;background:var(--main);color:var(--ground);border-radius:5px;padding:2px 7px;animation:pop .2s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.replay{margin-top:6px;font:inherit;font-size:14px;font-weight:700;background:none;border:1.5px solid var(--main);color:var(--main);border-radius:999px;padding:4px 14px;cursor:pointer}
.replay:hover{background:var(--surface)}

/* nav */
nav.bar{position:sticky;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding:12px clamp(16px,4vw,40px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.btn{font:inherit;font-weight:800;font-size:16px;border-radius:10px;padding:10px 22px;cursor:pointer;border:2px solid var(--main);background:transparent;color:var(--main)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#16181a}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.replay:focus-visible,.seg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{flex:1;display:flex;gap:4px;align-items:center}
.seg{flex:1;height:8px;border-radius:4px;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.seg.done{background:var(--main-soft)}.seg.cur{background:var(--accent)}
.count{font-size:14px;color:var(--ink-2);min-width:52px;text-align:center}
@media (max-width:820px){
  .slide{grid-template-columns:1fr}
  .copy{max-width:none}
  .btn{padding:9px 14px}
  header .course{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}

/* L24 additions */
.tile.acc{border-color:var(--accent);background:var(--accent-soft)}
.tile.acc .v{color:var(--accent-deep)}
.tblwrap{overflow-x:auto;width:100%}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--ground);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:16px}
.tbl th{background:var(--main);color:var(--ground);font-weight:800;font-size:14px;padding:8px 10px;text-align:center;line-height:1.25}
.tbl th.acc{background:var(--accent);color:#16181a}
.tbl td{padding:5px 10px;text-align:center;border-top:1px solid var(--surface-2);white-space:nowrap}
.tbl td.rh{font-weight:800;color:var(--main);text-align:left}
.tbl td.hl{color:var(--accent-deep);font-weight:800;background:var(--accent-soft)}
.tbl .rv{opacity:0;transition:opacity .35s}
.tbl .rv.in{opacity:1}
.tbl tr.rv td{transition:opacity .35s}
.tfoot{font-size:15px;color:var(--ink);text-align:center;margin-top:12px;font-weight:600}
.tfoot b{color:var(--accent-deep);font-weight:800}
.cap{font-size:14px;font-weight:800;color:var(--accent-deep);text-align:center;min-height:1.6em;transition:opacity .3s}
.draw{transition:stroke-dashoffset .8s ease}
.draw.in{stroke-dashoffset:0 !important}
.mv{transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
.tiles.small .tile .v{font-size:clamp(18px,2.2vw,22px)}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><span class="course" id="course"></span></header>
<main id="deck" aria-live="polite"></main>
<nav class="bar">
  <button class="btn" id="back">Back</button>
  <div class="prog" id="prog"></div>
  <span class="count" id="count"></span>
  <button class="btn primary" id="next">Next</button>
</nav>
<script>
const FILM = {"title": "Why pair the data?", "course": "MATH 1040, Lesson 24.1", "slides": [{"tag": "The problem", "title": "Does the medication lower blood pressure?", "body": "<p>A clinic measures the systolic blood pressure of <b>10<\/b> patients, starts them on a new medication, and measures them again <b>4 weeks<\/b> later.<\/p><p>To see why pairing matters, let’s first look at the data the <b>wrong<\/b> way: as two separate groups, like in Lesson 22.<\/p><p class='note'>Each dot is one reading. Top row: before. Bottom row: after.<\/p>", "visual": {"type": "dots2", "a": [148, 152, 139, 160, 145, 155, 150, 142, 158, 149], "b": [140, 145, 138, 150, 138, 148, 144, 139, 150, 141], "names": ["Before", "After"], "min": 135, "max": 162, "step": 5, "xlab": "systolic blood pressure", "stage": 0, "aria": "Dotplots of blood pressure before and after"}}, {"tag": "Two separate groups", "title": "The groups overlap a lot", "body": "<div class='math'>\\[\\bar x_1 = 149.8 \\qquad \\bar x_2 = 143.3\\]<\/div><p>The average dropped by <b>6.5<\/b> points. But look at how much the patients differ from <i>each other<\/i>: readings range from 138 to 160.<\/p><div class='math'>\\[s_1 \\approx 6.730 \\qquad s_2 \\approx 4.785\\]<\/div><p>Since the patient-to-patient standard deviations are both about the same as the difference in the means (\\(\\bar x_1-\\bar x_2 = 6.5\\)), that difference is rather small.<\/p>", "visual": {"type": "dots2", "a": [148, 152, 139, 160, 145, 155, 150, 142, 158, 149], "b": [140, 145, 138, 150, 138, 148, 144, 139, 150, 141], "names": ["Before", "After"], "min": 135, "max": 162, "step": 5, "xlab": "systolic blood pressure", "stage": 1, "ma": 149.8, "mb": 143.3, "mlab": ["x̄₁ = 149.8", "x̄₂ = 143.3"], "spreadNote": "", "aria": "Dotplots with means marked"}}, {"tag": "Two separate groups", "title": "As independent samples, the evidence is modest", "body": "<p>With the Lesson 22 formula:<\/p><div class='math'>\\[SE=\\sqrt{\\tfrac{6.730^2}{10}+\\tfrac{4.785^2}{10}}\\approx 2.611\\]<\/div><div class='math'>\\[t=\\frac{6.5}{2.611}\\approx 2.49\\]<\/div><p>Most of that standard error comes from the variance <b>between patients<\/b>, not from the effects of the medication.<\/p><p class='note'>Remember, this is the wrong method for this data. We do it only to compare.<\/p><p>With \\(df = 9\\), the right-tailed critical value is \\(t_c = 1.833\\). The test statistic lands in the critical region, but only just.<\/p>", "visual": {"type": "curve", "df": 9, "range": 8, "tickStep": 2, "rejText": "Critical Region", "rejAt": 3.8, "tails": "right", "tc": 1.833, "t": 0, "tlab": "", "plab": "", "stage": 0, "marks": [{"t": 2.49, "lab": "t ≈ 2.49", "sub": "independent", "soft": true}]}}, {"tag": "Pair the data", "title": "Connect each patient to their own readings", "body": "<p>To better see the effect of the medication, we need to instead look at the before and after numbers for the individuals. Remember, these aren’t two separate groups. They are the <b>same 10 patients<\/b> measured twice.<\/p><p>Draw a line from each patient’s before reading to their after reading.<\/p><p class='ask'>Every line slants to the left. Whether a patient started high or low, their own blood pressure went down.<\/p>", "visual": {"type": "dots2", "a": [148, 152, 139, 160, 145, 155, 150, 142, 158, 149], "b": [140, 145, 138, 150, 138, 148, 144, 139, 150, 141], "names": ["Before", "After"], "min": 135, "max": 162, "step": 5, "xlab": "systolic blood pressure", "stage": 2, "aria": "Lines connecting each patient's two readings"}}, {"tag": "Pair the data", "title": "Subtract to get one list", "body": "<p>For each patient, subtract:<\/p><div class='math'>\\[d = \\text{Before} - \\text{After}\\]<\/div><p>The 10 differences are 8, 7, 1, 10, 7, 7, 6, 3, 8, 8.<\/p><div class='math'>\\[\\bar d = 6.5 \\qquad s_d \\approx 2.635\\]<\/div><p>Every difference is positive, and they cluster tightly. Two lists have become <b>one<\/b>.<\/p>", "visual": {"type": "ddot", "vals": [8, 7, 1, 10, 7, 7, 6, 3, 8, 8], "min": -2, "max": 12, "step": 2, "xlab": "d = Before − After", "mean": 6.5, "mlab": ["d̄ = 6.5"], "aria": "Dotplot of the 10 differences"}}, {"tag": "Why it works", "title": "Subtracting cancels the patient-to-patient spread", "body": "<p>Look at patients 5 and 6. Patient 6 started 10 points higher than patient 5, and four weeks later patient 6 is <b>still<\/b> 10 points higher.<\/p><p>That gap is about who the patients are, not the medication. It shows up in both readings, so it cancels when we subtract: both patients have \\(d = 7\\).<\/p><p>What’s left is just the <b>change<\/b>. The standard deviations of the before and after readings are large. But if we look at the differences, notice how that spread decreases:<\/p>", "visual": {"type": "combo", "delays": [0, 2200], "parts": [{"type": "table", "cols": ["Patient", "Before", "After", "d = Before − After"], "reveal": 3, "rows": [["5", "145", "138", "7"], ["6", "155", "148", "7"], ["Gap", "10", "10", "0"]]}, {"type": "tiles", "cols": 1, "gap": 450, "items": [["Spread of the before readings", "s₁ ≈ 6.730"], ["Spread of the after readings", "s₂ ≈ 4.785"], ["Spread of the differences", "s<sub>d<\/sub> ≈ 2.635", true]], "cap": "Less noise means a smaller standard error."}]}}, {"tag": "Same data, two analyses", "title": "Pairing makes the evidence three times stronger", "body": "<p>As a one-sample t-test on \\(d\\):<\/p><div class='math'>\\[SE=\\frac{2.635}{\\sqrt{10}}\\approx 0.8333 \\qquad t=\\frac{6.5}{0.8333}\\approx 7.80\\]<\/div><p>Both analyses have \\(df = 9\\) and \\(t_c = 1.833\\). Same data, same 6.5-point drop. But the paired \\(t\\) is more than three times as large: 2.49 barely clears the critical value, while 7.80 is far out in the tail. The noise from patient-to-patient differences is gone.<\/p><p class='note'>For paired data, the independent method isn’t just weaker. It’s the wrong model, because the two lists aren’t independent.<\/p>", "visual": {"type": "curve", "df": 9, "range": 8, "tickStep": 2, "rejText": "Critical Region", "rejAt": 3.8, "tails": "right", "tc": 1.833, "t": 0, "tlab": "", "plab": "", "stage": 0, "marks": [{"t": 2.49, "lab": "t ≈ 2.49", "sub": "independent", "soft": true}, {"t": 7.8, "lab": "t ≈ 7.80", "sub": "paired"}]}}, {"tag": "Order of subtraction", "title": "What if we subtract the other way?", "body": "<p>Nothing forces us to use Before − After. Let’s try<\/p><div class='math'>\\[d = \\text{After} - \\text{Before}\\]<\/div><p>Every difference flips sign: −8, −7, −1, −10, … The whole dotplot mirrors across 0, so \\(\\bar d = -6.5\\).<\/p><p>The spread doesn’t change: \\(s_d\\) is still about 2.635.<\/p>", "visual": {"type": "ddot", "vals": [8, 7, 1, 10, 7, 7, 6, 3, 8, 8], "min": -12, "max": 12, "step": 4, "xlab": "difference d", "flip": true, "mean": 6.5, "mlab": ["d̄ = 6.5", "d̄ = −6.5"], "cap": ["d = Before − After", "d = After − Before"], "aria": "Differences mirroring from positive to negative"}}, {"tag": "Order of subtraction", "title": "Different signs, same conclusion", "body": "<p>Flipping the order flips every sign, including the direction of \\(H_A\\). The evidence is identical.<\/p><p class='ask'>Either way: the medication lowers systolic blood pressure.<\/p><p>Pick an order, write it down, and use it for the hypotheses, the interval, and the conclusion.<\/p>", "visual": {"type": "table", "rowhead": true, "reveal": "rows", "cols": ["", "Before − After", "After − Before"], "rows": [["d̄", "6.5", "−6.5"], ["s<sub>d<\/sub>", "2.635", "2.635"], ["H<sub>A<\/sub>", "μ<sub>d<\/sub> &gt; 0", "μ<sub>d<\/sub> &lt; 0"], ["90% CI", "(4.972, 8.028)", "(−8.028, −4.972)"], ["t", "7.80", "−7.80"], ["p-value", "&lt; 0.0001", "&lt; 0.0001"]]}}, {"tag": "The takeaway", "title": "Pair, subtract, then run a one-sample t", "body": "<p>Paired data lets each individual act as their own control. Subtracting removes the differences between individuals, so a real effect stands out.<\/p><p>After subtracting, the differences can be analyzed as a one-sample t-test as we did in Lessons 18 and 20, but with a null value of 0.<\/p>", "visual": {"type": "tiles", "cols": 1, "gap": 450, "items": [["1. Match", "Pair each reading with its partner"], ["2. Subtract", "d = x₁ − x₂, the same order every time"], ["3. Analyze", "One-sample \\(t\\) on \\(d\\), with \\(\\mu_0 = 0\\)", true]], "small": true}}]};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const deck = document.getElementById('deck');
document.getElementById('ttl').textContent = FILM.title;
document.getElementById('course').textContent = FILM.course;
const NS='http://www.w3.org/2000/svg';
let timers=[];
function later(fn,ms){const t=setTimeout(fn,RM?0:ms);timers.push(t);return t}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,cls,anchor){const t=svgEl('text',{x,y,'text-anchor':anchor||'middle'},parent);if(cls)t.setAttribute('class',cls);t.textContent=s;return t}
function num(x,dp){return (x<0?'−':'')+Math.abs(x).toFixed(dp)}
function sub(parent,x,y,base,s,rest,cls,anchor){const t=txt(parent,x,y,base,cls,anchor);const b=svgEl('tspan',{'baseline-shift':'sub','font-size':'11'},t);b.textContent=s;const r=svgEl('tspan',{},t);r.textContent=rest;return t}
function ticks(s,v,X,ax,labY){
  for(let t=v.min;t<=v.max+1e-9;t+=v.step){
    const x=X(t);svgEl('line',{x1:x,x2:x,y1:ax-6,y2:ax+6,stroke:'var(--ink-2)','stroke-width':1.5},s);

/* t (or z) curve. tails: right | left | two */
function curve(v){
  const W=560,H=300,L=20,R=540,base=230,top=40,lo=-v.range,hi=v.range;
  const X=z=>L+(z-lo)/(hi-lo)*(R-L);
  const pdf=v.df?(z=>Math.pow(1+z*z/v.df,-(v.df+1)/2)):(z=>Math.exp(-z*z/2));
  const Y=z=>base-(base-top)*pdf(z);
  const area=(a,b)=>{let d=`M${X(a)},${base}`;for(let z=a;z<=b+1e-9;z+=0.02)d+=`L${X(z).toFixed(1)},${Y(z).toFixed(1)}`;return d+`L${X(b)},${base}Z`};
  const sides=v.tails==='two'?[1,-1]:(v.tails==='left'?[-1]:[1]);
  const tail=(c,sg)=>sg>0?area(c,hi):area(lo,-c);
  const p=el('div','panel');
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'t-distribution curve'});
  const items=[];
  const crit=svgEl('g',{class:'fade'},s);
  sides.forEach(sg=>svgEl('path',{d:tail(v.tc,sg),fill:'var(--accent-soft)'},crit));
  const pv=svgEl('g',{class:'fade'},s);
  const pc=v.tails==='two'?Math.abs(v.t):(v.tails==='left'?-v.t:v.t);
  sides.forEach(sg=>svgEl('path',{d:tail(Math.min(pc,hi-0.01),sg),fill:'var(--accent)','fill-opacity':Math.abs(v.t)<v.tc?.45:1},pv));
  let line='';for(let z=lo;z<=hi;z+=0.02)line+=(line?'L':'M')+X(z).toFixed(1)+','+Y(z).toFixed(1);
  svgEl('path',{d:line,fill:'none',stroke:'var(--main)','stroke-width':3},s);
  svgEl('line',{x1:L,x2:R,y1:base,y2:base,stroke:'var(--ink-2)','stroke-width':2},s);
  for(let t=-Math.floor(v.range);t<=Math.floor(v.range);t+=(v.tickStep||1)){svgEl('line',{x1:X(t),x2:X(t),y1:base,y2:base+6,stroke:'var(--ink-2)'},s);txt(s,X(t),base+22,String(t).replace('-','−'))}
  txt(s,X(0),base+48,v.df?`t  (df = ${v.df})`:'z');
  const cg=svgEl('g',{class:'fade'},s);
  sides.forEach(sg=>{
    svgEl('line',{x1:X(sg*v.tc),x2:X(sg*v.tc),y1:top+6,y2:base,stroke:'var(--accent-deep)','stroke-width':2,'stroke-dasharray':'5 4'},cg);
    sub(cg,X(sg*v.tc),top-4,'t','c',' = '+(sg<0?'−':'')+v.tc,'lbla');
  });
  const rej=svgEl('g',{class:'fade'},s);
  sides.forEach(sg=>txt(rej,v.rejAt!=null?X(sg*v.rejAt):X(sg*(v.tc+0.12)),v.rejAt!=null?base-12:base-58,v.rejText||(v.stage>=4?'reject H₀':'reject H₀ here'),'lbla',sg>0?'start':'end'));
  const zg=svgEl('g',{class:'drop'},s);
  svgEl('line',{x1:X(v.t),x2:X(v.t),y1:top+46,y2:base,stroke:'var(--main)','stroke-width':3},zg);
  svgEl('circle',{cx:X(v.t),cy:top+46,r:7,fill:'var(--main)'},zg);
  txt(zg,X(v.t)+(v.t<0?-8:8),top+34,'t = '+v.tlab,'lblm',v.t<0?'end':'start');
  const pl=svgEl('g',{class:'fade'},s);
  txt(pl,X(v.tails==='left'?-2.6:2.6),base-30,v.plab,'lbl',v.tails==='left'?'end':'start');
  const ht=svgEl('g',{class:'fade'},s);
  if(v.tails==='two') txt(ht,X(0),top-22,'two-tailed test','lblm');
  else txt(ht,X((v.tails==='right'?-1:1)*(v.range>5?5:2.2)),top+30,v.tails==='right'?'right-tailed test':'left-tailed test','lblm');
  const vd=svgEl('g',{class:'fade'},s);
  if(v.verdict)txt(vd,X(0),base+72,v.verdict,'lbla');
  if(v.marks){
    items.push([crit,250],[cg,600],[rej,900],[ht,1100]);
    v.marks.forEach((m,i)=>{
      const g=svgEl('g',{class:'drop'},s);
      const col=m.soft?'var(--main-soft)':'var(--main)';
      if(m.t<hi-0.05){
        svgEl('line',{x1:X(m.t),x2:X(m.t),y1:top+46,y2:base,stroke:col,'stroke-width':3},g);
        svgEl('circle',{cx:X(m.t),cy:top+46,r:7,fill:col},g);
        const lf=X(m.t)>R-120,lx=X(m.t)+(lf?-10:8),an=lf?'end':'start';
        txt(g,lx,top+34,m.lab,m.soft?'lbl':'lblm',an);
        if(m.sub)txt(g,lx,top+52,m.sub,'',an);
      }else{
        const y=top+110,x1=X(hi-1.15),x2=X(hi)-2;
        svgEl('line',{x1,x2:x2-8,y1:y,y2:y,stroke:col,'stroke-width':4},g);
        svgEl('path',{d:`M${x2},${y}L${x2-14},${y-8}L${x2-14},${y+8}Z`,fill:col},g);
        txt(g,x2,y-(m.sub?30:12),m.lab,m.soft?'lbl':'lblm','end');
        if(m.sub)txt(g,x2,y-12,m.sub,'','end');
      }
      items.push([g,1500+i*1500]);
    });
  }
  if(v.stage===1){items.push([crit,300],[rej,700],[ht,1000])}
  if(v.stage===2){items.push([zg,300])}
  if(v.stage>=3){items.push([crit,250],[cg,600],[rej,900],[zg,1300],[pv,1900],[pl,2200])}
  if(v.stage>=4){items.push([vd,2700])}
  p.appendChild(s);
  return {node:p,play(){items.forEach(([e,ms])=>later(()=>e.classList.add('in'),ms))}};
}

const KEYLBL={UP:'▲',DOWN:'▼',LEFT:'◄',RIGHT:'►',NEG:'(−)',MUL:'×',SUB:'−',ADD:'+',DIV:'÷',XT:'X,T,θ,n','2ND':'2ND'};
function calc(v){
  const wrap=el('div','visual-calc panel');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%';
  const c=el('div','calc');
  const scr=el('div','screen');scr.setAttribute('role','img');scr.setAttribute('aria-label','Calculator screen');
  c.appendChild(scr);
  const keys=el('div','keys');
  const mk=(id,label,cls)=>{const b=el('button','key '+(cls||'')+' k-'+id,label);b.tabIndex=-1;b.setAttribute('aria-hidden','true');b.dataset.k=id;return b};
  const top=el('div','toprow');const lk=el('div','lkeys');
  [['2ND','2ND','blue'],['MODE','MODE'],['ALPHA','ALPHA'],['STAT','STAT']].forEach(a=>lk.appendChild(mk(...a)));
  const dp=el('div','dpad');['UP','DOWN','LEFT','RIGHT'].forEach(k=>dp.appendChild(mk(k,KEYLBL[k])));
  top.appendChild(lk);top.appendChild(dp);keys.appendChild(top);
  [['7','8','9','DIV'],['4','5','6','MUL'],['1','2','3','SUB'],['0','.','NEG','ENTER']].forEach(r=>r.forEach(k=>{
    const isNum=/^[0-9.]$|NEG/.test(k);keys.appendChild(mk(k,KEYLBL[k]||k,isNum?'num':(k==='ENTER'?'enter':'')))
  }));
  c.appendChild(keys);
  const log=el('div','log');
  const rp=el('button','replay','Replay keystrokes');
  wrap.appendChild(c);wrap.appendChild(log);wrap.appendChild(rp);
  function draw(lines){
    scr.innerHTML='';
    lines.forEach(l=>{const d=el('div','ln');l.forEach(([t,st])=>{const sp=el('span',st||'');sp.textContent=t;d.appendChild(sp)});scr.appendChild(d)});
  }
  function run(){
    clearTimers();log.innerHTML='';draw(v.seg.start);
    let t=500;
    v.seg.steps.forEach(st=>{t+=st.w||0;
      later(()=>{
        const k=keys.querySelector('.k-'+CSS.escape(st.k));
        if(k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),RM?0:240)}
        log.appendChild(el('span','chip',st.c||KEYLBL[st.k]||st.k));
        draw(st.s);
      },t);
      t+= (/^[0-9.]$|NEG/.test(st.k)&&!st.c)?420:700;
    });
  }
  rp.onclick=run;
  draw(v.seg.start);
  return {node:wrap,play:run};
}
function combo(v){

/* ---------- deck ---------- */
const slides=FILM.slides.map((s,i)=>{
  const sec=el('section','slide');sec.setAttribute('aria-label',`Slide ${i+1}: ${s.title}`);

let cur=-1;
function go(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  clearTimers();
  if(cur>=0) slides[cur].sec.classList.remove('on');

  const v=BUILD[s.visual.type](s.visual);vis.innerHTML='';vis.appendChild(v.node);slides[i].v=v;
  slides[i].sec.classList.add('on');cur=i;
  segs.forEach((b,j)=>{b.className='seg'+(j<i?' done':'')+(j===i?' cur':'');b.setAttribute('aria-current',j===i?'step':'false')});
  document.getElementById('count').textContent=`${i+1} / ${slides.length}`;
  document.getElementById('back').disabled=i===0;
  const nx=document.getElementById('next');nx.textContent=i===slides.length-1?'Start over':'Next';
  if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([vis]).catch(()=>{});
  v.play();
  try{history.replaceState(null,'','#slide-'+(i+1))}catch(e){}
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
document.getElementById('back').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur===slides.length-1?0:cur+1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(cur===slides.length-1?cur:cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?+m[1]-1:0}
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());

</script>
</body>
